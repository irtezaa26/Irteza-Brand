    <section class="page-title">
        <div class="container">
            <h1>My Wishlist</h1>
            <p id="wishlistSummary" class="summary">Your favourite fragrances, saved in one place.</p>
        </div>
    </section>

    <main class="container wishlist-wrap">

        <div id="wishlistToolbar" class="toolbar d-none">
            <span id="itemsLabel"></span>
            <div class="d-flex gap-2 flex-wrap">
                <button id="addAllToCart" class="btn btn-gold btn-sm" type="button">
                    <i class="bi bi-bag-plus"></i> Add all to cart
                </button>
                <button id="clearWishlist" class="btn btn-outline-gold btn-sm" type="button">
                    <i class="bi bi-trash3"></i> Clear wishlist
                </button>
            </div>
        </div>

        <div id="wishlistItems" class="row g-4"></div>

        <div id="emptyState" class="empty-state d-none">
            <i class="bi bi-heart"></i>
            <h2>Your wishlist is empty</h2>
            <p>Tap the heart on any product and it will be saved here.</p>
            <a href="shop.html" class="btn btn-gold">Browse the shop</a>
        </div>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="wishToast" class="toast align-items-center border-0" role="status" aria-live="polite" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="wishToastText"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(function () {

            var WISHLIST_KEY = "irtezeWishlist";
            var CART_KEY = "irtezeCart";
            var DEFAULT_SUMMARY = "Your favourite fragrances, saved in one place.";

            function readList(key) {
                try {
                    var data = JSON.parse(localStorage.getItem(key));
                    return Array.isArray(data) ? data : [];
                } catch (error) {
                    return [];
                }
            }

            function saveList(key, list) {
                localStorage.setItem(key, JSON.stringify(list));
            }

            var wishlist = readList(WISHLIST_KEY);

            function updateCounts() {
                var cart = readList(CART_KEY);
                var cartQty = 0;
                cart.forEach(function (item) {
                    cartQty += Number(item.quantity) || 1;
                });
                $("#cartCount").text(cartQty).toggle(cartQty > 0);
                $("#wishlistCount").text(wishlist.length).toggle(wishlist.length > 0);
            }

            function showToast(text) {
                $("#wishToastText").text(text);
                bootstrap.Toast.getOrCreateInstance(document.getElementById("wishToast"), { delay: 2200 }).show();
            }

            function formatPrice(value) {
                return "Rs. " + (Number(value) || 0).toLocaleString("en-PK");
            }

            function pushToCart(cart, item) {
                var existing = cart.find(function (c) { return c.name === item.name; });
                if (existing) {
                    existing.quantity = (Number(existing.quantity) || 1) + 1;
                } else {
                    cart.push({
                        name: item.name,
                        price: Number(item.price) || 0,
                        image: item.image || "",
                        quantity: 1
                    });
                }
            }

            function render() {
                var $grid = $("#wishlistItems").empty();

                if (wishlist.length === 0) {
                    $("#emptyState").removeClass("d-none");
                    $("#wishlistToolbar").addClass("d-none");
                    $("#wishlistSummary").text(DEFAULT_SUMMARY);
                    updateCounts();
                    return;
                }

                $("#emptyState").addClass("d-none");
                $("#wishlistToolbar").removeClass("d-none");

                var label = wishlist.length === 1 ? "1 item saved" : wishlist.length + " items saved";
                $("#itemsLabel").text(label);
                $("#wishlistSummary").text(label);

                wishlist.forEach(function (item, index) {
                    var $col = $("<div>").addClass("col-12 col-sm-6 col-lg-4 col-xl-3");
                    var $card = $("<article>").addClass("wish-card").attr("data-index", index);

                    var $imgBox = $("<div>").addClass("wish-img");
                    if (item.image) {
                        $("<img>").attr({ src: item.image, alt: item.name || "Product", loading: "lazy" }).appendTo($imgBox);
                    } else {
                        $("<i>").addClass("bi bi-image placeholder-icon").appendTo($imgBox);
                    }

                    $("<button>")
                        .attr({ type: "button", "aria-label": "Remove from wishlist" })
                        .addClass("wish-remove btn-remove")
                        .html('<i class="bi bi-x-lg"></i>')
                        .appendTo($imgBox);

                    var $body = $("<div>").addClass("wish-body");
                    $("<h3>").addClass("wish-name").text(item.name || "Product").appendTo($body);
                    $("<p>").addClass("wish-price").text(formatPrice(item.price)).appendTo($body);
                    $("<button>")
                        .attr("type", "button")
                        .addClass("btn btn-gold w-100 btn-move")
                        .html('<i class="bi bi-bag-plus"></i> Add to cart')
                        .appendTo($body);

                    $card.append($imgBox, $body);
                    $col.append($card);
                    $grid.append($col);
                });

                updateCounts();
            }

            $("#wishlistItems").on("click", ".btn-remove", function () {
                var index = Number($(this).closest(".wish-card").attr("data-index"));
                var removed = wishlist.splice(index, 1)[0];
                saveList(WISHLIST_KEY, wishlist);
                render();
                showToast((removed && removed.name ? removed.name : "Item") + " removed from your wishlist.");
            });

            $("#wishlistItems").on("click", ".btn-move", function () {
                var index = Number($(this).closest(".wish-card").attr("data-index"));
                var item = wishlist[index];
                if (!item) return;

                var cart = readList(CART_KEY);
                pushToCart(cart, item);
                saveList(CART_KEY, cart);

                wishlist.splice(index, 1);
                saveList(WISHLIST_KEY, wishlist);

                render();
                showToast(item.name + " added to your cart.");
            });

            $("#addAllToCart").on("click", function () {
                if (wishlist.length === 0) return;

                var cart = readList(CART_KEY);
                var total = wishlist.length;
                wishlist.forEach(function (item) { pushToCart(cart, item); });
                saveList(CART_KEY, cart);

                wishlist = [];
                saveList(WISHLIST_KEY, wishlist);

                render();
                showToast(total + (total === 1 ? " item" : " items") + " added to your cart.");
            });

            $("#clearWishlist").on("click", function () {
                if (wishlist.length === 0) return;
                if (confirm("Clear your entire wishlist?")) {
                    wishlist = [];
                    saveList(WISHLIST_KEY, wishlist);
                    render();
                    showToast("Wishlist cleared.");
                }
            });

            $("#footerYear").text(new Date().getFullYear());

            render();
        });
    </script>

/* MOBILE MENU */

}

header .navbar-toggler:focus {

    }

    header .navbar-nav .nav-link {
        margin: 4px 0;
    }

    header .navbar-nav .nav-link::after {
        left: 50%;
        transform: translateX(-50%);
    }

    header .navbar-nav .nav-link:hover::after,
    header .navbar-nav .nav-link.active::after {

    }

/* FOOTER */

    color: #f5f0e8;
    border-top: 1px solid rgba(201, 169, 110, 0.4);
}

}

    text-decoration: none !important;

}

}

footer .bi-facebook,
footer .bi-tiktok {
    transition: color 0.3s ease, transform 0.3s ease;
}

footer a:hover .bi-instagram,
footer a:hover .bi-facebook,
footer a:hover .bi-tiktok {

}

}

}

/* CART BUTTON */
.irteze-cart {
    position: relative;
    width: 44px;
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: #c9a96e !important;
    border: 1px solid #c9a96e;
    border-radius: 50%;
    text-decoration: none !important;
    transition: all 0.3s ease;

.irteze-cart svg {

.irteze-cart #cartCount {

    top: -6px;
    right: -6px;
    min-width: 20px;
    height: 20px;
    padding: 0 5px;

    align-items: center;
    justify-content: center;

    color: #0b0b0b;
    font-size: 11px;
    font-weight: 700;

    border-radius: 50px;

.irteze-cart:hover {

    color: #0b0b0b !important;
    transform: translateY(-2px);
}

.irteze-cart:hover #cartCount {
    background: #0b0b0b;
    color: #c9a96e;
}
/* WISHLIST HEART */

    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #c9a96e !important;

    line-height: 1;
    text-decoration: none !important;
    transition: all 0.3s ease;
}

.irteze-heart:hover {
    color: #ffffff !important;
    transform: translateY(-2px);
}

.irteze-heart #wishlistCount {
    position: absolute;
    top: -8px;
    right: -10px;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #c9a96e;
    color: #0b0b0b;
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    border-radius: 50px;

    display: block;
